<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function() {
      if (window.location.protocol === 'file:') return;
      var path = window.location.pathname;
      var cleanPath = null;
      if (path.endsWith('/index.html')) {
        cleanPath = path.substring(0, path.length - 10) || '/';
      } else if (path.endsWith('.html')) {
        cleanPath = path.substring(0, path.length - 5);
      }
      if (cleanPath !== null) {
        window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Linkadda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/admin.css?v=34" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/lucide@latest';"></script>
</head>
<body data-theme="dark">
  <main id="authMount"></main>
  <script type="module">
    import { mountLoginPage, whenAuthenticated } from './js/auth.js';
    const mount = document.getElementById('authMount');
    whenAuthenticated((user) => {
      if (user) {
        window.location.href = '/admin';
      }
    });
    mountLoginPage(mount);
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
